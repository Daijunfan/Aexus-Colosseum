services:
  attackbox:
    image: arena-attackbox-attackbox:latest
    build: .
    container_name: arena-attackbox
    hostname: attackbox
    command: ["sleep", "infinity"]
    # Host networking lets the operator reach every published lab port on
    # 127.0.0.1 exactly as if they were sitting on the Arena host.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - /srv/arena/shared:/shared
      - /srv/arena/shared/attackbox:/shared/attackbox
    mem_limit: 8g
    cpus: 4.0
    restart: unless-stopped
